services:
  - type: web
    name: treasure-count-api
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build:backend
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: COOKIE_SECURE
        value: "true"
      - key: APP_ORIGIN
        value: https://fish.abishanan.tech
      - key: DATABASE_URL
        sync: false
